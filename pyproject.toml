[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trainer-zero"
version = "0.1.0"
description = "A model-agnostic PyTorch training engine powered by Accelerate."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=0.30",
  "torch>=2.1",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
wandb = ["wandb>=0.16"]
dev = ["pytest>=8.0"]

[project.scripts]
trainer-zero = "trainer_zero.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
